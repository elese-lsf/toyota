<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan de Ahorro Toyota – Prototipo de dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#EDEEF0;--surface:#FFFFFF;--ink:#17202B;--muted:#5B6673;--line:#D9DDE2;
  --red:#D4202F;--sc-base:#2B5C8F;--sc-opt:#2D7A5A;--sc-pes:#C27A12;--soft:#F4F5F7;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10151C;--surface:#18202A;--ink:#E8ECF1;--muted:#98A3B0;--line:#2B3542;--red:#F0505C;--sc-base:#6FA3DA;--sc-opt:#5CC39A;--sc-pes:#E5A04A;--soft:#1E2733}
}
:root[data-theme="dark"]{--bg:#10151C;--surface:#18202A;--ink:#E8ECF1;--muted:#98A3B0;--line:#2B3542;--red:#F0505C;--sc-base:#6FA3DA;--sc-opt:#5CC39A;--sc-pes:#E5A04A;--soft:#1E2733}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding:0 12px 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.brand h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:25px;margin:0;letter-spacing:.2px}
.brand h1 i{display:inline-block;width:10px;height:22px;background:var(--red);margin-right:9px;vertical-align:-3px;border-radius:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.seg button:focus-visible,.nav button:focus-visible,select:focus-visible,input:focus-visible,.alert:focus-visible{outline:2px solid var(--sc-base);outline-offset:2px}
.nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:9px 12px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--red);font-weight:600}
.banner{font-size:12.5px;color:var(--muted);padding:8px 0}
h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600;margin:18px 0 8px}
h3{font-size:15px;font-weight:600;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;min-width:0}
.g2{display:grid;grid-template-columns:1fr;gap:0 14px}
@media (min-width:760px){.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)!important}}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13px}
.kpi small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
svg{width:100%;height:auto;display:block}
svg .grid{stroke:var(--line);stroke-width:1}
svg .ax{fill:var(--muted);font-size:11px;font-family:'Barlow',sans-serif}
svg .vl{fill:var(--ink);font-size:10.5px;font-family:'Barlow',sans-serif;font-weight:500}
svg .split{stroke:var(--muted);stroke-dasharray:3 3}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.legend i.sq{height:10px;width:10px;vertical-align:-1px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:12.5px}
td.h{text-align:center;font-weight:500;color:var(--ink)}
.na{color:var(--line)}
select,input[type=number]{font:inherit;font-size:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;max-width:100%}
input[type=number]{width:64px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
@media (min-width:760px){.filters{grid-template-columns:repeat(4,1fr)}}
.filters label,.ctl label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.filters select{width:100%}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:10px}
.alert{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font:inherit;color:inherit}
.alert:last-child{border-bottom:0}
.pill{min-width:28px;text-align:center;border-radius:99px;padding:2px 8px;font-weight:600;font-size:13px;background:var(--soft);color:var(--muted)}
.pill.on{background:var(--red);color:#fff}
.alert span.t{flex:1}
.alert small{display:block;color:var(--muted);font-size:12.5px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.red{border-color:var(--red);color:var(--red)}
.note{border-left:3px solid var(--sc-pes);background:var(--soft);padding:8px 10px;font-size:13px;margin:8px 0;border-radius:0 6px 6px 0}
.hb{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:13.5px}
.hb div.bar{height:14px;background:var(--soft);border-radius:3px;overflow:hidden}
.hb div.bar i{display:block;height:100%;background:var(--sc-base)}
.hb b{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.champ{background:var(--soft);font-weight:600}
table.pv{font-size:12.5px}
table.pv th,table.pv td{padding:5px 7px;text-align:right;white-space:nowrap}
table.pv th:first-child,table.pv td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;white-space:normal;min-width:150px;max-width:190px}
table.pv tr.mrow td{font-weight:600;background:var(--soft);border-bottom:1px solid var(--sc-base)}
table.pv td.vn{padding-left:16px}
table.pv th.pj{color:var(--sc-pes)}
.vsel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
@media (min-width:760px){.vsel{grid-template-columns:repeat(4,1fr)}}
.vb{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:10px 12px;text-align:left;font:inherit;cursor:pointer}
.vb b{display:block;font-weight:600}.vb span.t{font-size:12.5px;color:var(--muted)}
.vb[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.vb:focus-visible{outline:2px solid var(--sc-base);outline-offset:2px}
table.pv .p0{border-left:1px dashed var(--muted)}
table.pv tr.exc td{color:var(--muted)}
.seg.wrap{flex-wrap:wrap}
details.ms{position:relative;margin-bottom:12px}
details.ms summary{display:inline-block;list-style:none;cursor:pointer;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:14px;background:var(--surface)}
details.ms summary::-webkit-details-marker{display:none}
details.ms summary::after{content:' ▾';color:var(--muted)}
.msb{margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);max-height:300px;overflow:auto;max-width:min(360px,100%)}
.msb label{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:14px}
.msa{display:flex;gap:8px;margin-bottom:6px}
.msa button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:6px;padding:3px 9px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.card{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <h1><i></i>Plan de Ahorro Toyota</h1>
    <div class="seg" role="group" aria-label="Escenario" id="scseg"></div>
  </div>
  <nav class="nav" id="nav" aria-label="Secciones"></nav>
</header>
<div class="banner">Prototipo con datos ilustrativos. Las etiquetas “a definir” marcan lo que sigue pendiente con Toyota.</div>
<main id="view"></main>
</div>

<script>
/* ---------- utilidades ---------- */
const rng=s=>()=>((s=(s*1664525+1013904223)%4294967296)/4294967296);
const fmtN=n=>Math.round(n).toLocaleString('es-AR');
const fmtP=(n,d=1)=>n.toFixed(d).replace('.',',')+'%';
const fmt1=n=>n.toFixed(1).replace('.',',');
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const ml=i=>{const k=9+i;return MES[k%12]+' '+String(2024+Math.floor(k/12)).slice(2)};
const HN=24;                       // oct-24 .. sep-26 histórico; luego proyección hasta sep-29
const L60=[...Array(60)].map((_,i)=>ml(i));
const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))%9973,7);

const SC={
  base:{n:'Base',c:'var(--sc-base)',g:.004,mora:1,ven:1,seed:1},
  opt:{n:'Optimista',c:'var(--sc-opt)',g:.009,mora:.85,ven:1.12,seed:2},
  pes:{n:'Pesimista',c:'var(--sc-pes)',g:-.003,mora:1.3,ven:.85,seed:3}
};
const S={tab:'home',sc:'base',
  v:{nivel:'Todos',plan:'Todos',conc:'Todos',uf:'Todas',modelo:'Hilux'},
  cm:{dim:'cosecha',per:7},
  mora:{cuota:'separado'},
  gr:{a:3,b:3},
  shap:'Caída',cos:[0,1,2,3,4,5,6,7],msOpen:false,cuotas:'pct',convModelo:'Todos',yy:{mes:'Todos',a:2025,b:2026},ver:{modelo:'Yaris',vc:'XS'},dist:{modelo:'Todos',anio:'Todos',medida:'pct',off:[],modo:'rescale',open:false},mv:'ventas',mm:'Mora BCRA'};

/* ---------- datos sintéticos ---------- */
const H={};
(function(){const r=rng(7);let v=41200;H.car=[];H.ent=[];
  for(let i=0;i<HN;i++){v*=1+.0085+(r()-.5)*.004;H.car.push(v);H.ent.push(880+i*6+(r()-.5)*90)}})();
const PR={};
function proj(sc){
  if(PR[sc])return PR[sc];
  const s=SC[sc],r=rng(11+s.seed);let v=H.car[HN-1];const car=[],ent=[];
  for(let i=HN;i<60;i++){v*=1+s.g+(r()-.5)*.0015;car.push(v);ent.push(H.ent[HN-1]*s.ven*(1+(i-HN)*.002)+(r()-.5)*60)}
  return PR[sc]={car:[...H.car,...car],ent:[...H.ent,...ent]};
}
const fondos=(i,sc)=>proj(sc).car[i]/1000*.46*(1+.04*Math.sin(i/2.3)); // $ mil millones
const hp=(arr,k=HN)=>[arr.map((v,i)=>i<k?v:null),arr.map((v,i)=>i>=k-1?v:null)];

const MODELOS=['Hilux','Corolla Cross','Yaris','Corolla'];
const COSECHAS=['2024-T4','2025-T1','2025-T2','2025-T3','2025-T4','2026-T1','2026-T2','2026-T3'];

function vmod(){
  const v=S.v,k=[v.nivel,v.plan,v.conc,v.uf].join('|');
  if(k==='Todos|Todos|Todos|Todas')return 1;
  return 1+((hash(k)%25)-12)/100;
}
function triData(){
  const m=vmod(),r=rng(21);
  return COSECHAS.map((c,ci)=>{const row=[];
    for(let k=1;k<=8;k++){const mo=3*k;
      row.push(mo<=24-3*ci?Math.min(.6,.42*(1-Math.exp(-mo/16))*m*(1+(r()-.5)*.08)):null)}
    return row});
}

/* grupos individuales (≈2.500) */
let GRP=null;
function grupos(){
  if(GRP)return GRP;const r=rng(99);GRP=[];
  for(let i=0;i<2500;i++){
    const a=Math.min(14,Math.floor(-Math.log(1-r())*1.2));
    const b=Math.min(14,Math.floor(-Math.log(1-r())*1.4+(a>2?.8:0)));
    GRP.push({id:'G-'+(1000+i),plan:['100%','80%','70%'][i%3],a,b,p:8+Math.floor(r()*85)});
  }return GRP;
}
function flagged(){
  const {a,b}=S.gr;
  return grupos().filter(g=>g.a>=a||g.b>=b).sort((x,y)=>Math.max(y.a/a,y.b/b)-Math.max(x.a/a,x.b/b));
}

/* modelos: cuatro variables a predecir. Ventas y mora tienen modelo propio; flujo de fondos y entregas se arman combinándolos */
const mkBT=(seed,mb,mab,thr,at,add)=>{const r=rng(seed),model=[],ma=[];
  for(let i=0;i<18;i++){model.push(+(mb*(.7+r()*.6)+(i===at?add:0)).toFixed(2));ma.push(+(mab*(.8+r()*.4)).toFixed(2))}
  return {model,ma,thr}};
const MD={
  ventas:{n:'Planes vendidos',tipo:'propio',fam:'Series de tiempo',mod:'XGBoost con variables macro',alt:'Prophet, Auto-ARIMA y ETS',
    cortes:[8.4,7.3,6.8,6.2],champ:3,bt:mkBT(3,6.2,9.1,9,14,5),
    shap:[['Ventas de mercado',.30],['Salario real',.22],['Tipo de cambio',.18],['Estacionalidad',.16],['Inflación',.09],['Promociones',.05]]},
  'Mora BCRA':{n:'Mora BCRA (90 días)',tipo:'propio',fam:'Probabilidad y supervivencia',mod:'Hazard de riesgo proporcional',alt:'Logístico y Poisson',
    cortes:[7.9,6.6,5.4,5.9],champ:2,bt:mkBT(5,5.4,7.6,7.5,16,4),
    shap:[['Cuotas en mora',.36],['Mora BCRA',.24],['% de pago',.17],['Antigüedad',.13],['Plan de ventas',.06]]},
  'Caída':{n:'Caída (rescindidos y renunciados)',tipo:'propio',fam:'Probabilidad y supervivencia',mod:'Logístico',alt:'Hazard y Poisson',
    cortes:[6.9,5.8,5.1,4.8],champ:3,bt:mkBT(7,4.8,6.9,7,-1,0),
    shap:[['Mora BCRA',.31],['Antigüedad',.22],['% de pago',.19],['Cuotas en mora',.15],['Plan de ventas',.08]]},
  'Mora cuota 1 y 2':{n:'Mora cuota 1 y 2',tipo:'propio',fam:'Probabilidad y supervivencia',mod:'Poisson',alt:'Logístico y Hazard',
    cortes:[4.9,3.6,3.9,4.2],champ:1,bt:mkBT(9,3.6,5.2,6,-1,0),
    shap:[['% de pago',.33],['Antigüedad',.25],['Cuotas en mora',.18],['Mora BCRA',.10],['Plan de ventas',.09]]},
  ff:{n:'Flujo de fondos',tipo:'compuesto',mod:'Compuesto: ventas, mora y compras',mape:7.4,bt:mkBT(11,7.4,10.5,11,14,6),
    desc:'Los aportes salen de los planes vendidos y de cuánto se cobra (mora y caída). Las compras salen de los autos a entregar. Su error combina el de esos modelos.',
    comps:[['Planes vendidos','Series de tiempo',6.2,32],['Mora y caída','Probabilidad y supervivencia',5.4,41],['Compra de vehículos','Modelos a entregar',8.9,27]]},
  ent:{n:'Modelos a entregar',tipo:'compuesto',mod:'Compuesto: fondos, ventas y caída',mape:8.9,bt:mkBT(13,8.9,12.3,13,-1,0),
    desc:'Los autos a entregar dependen de los fondos disponibles, de los planes que llegan a adjudicación y de qué porcentaje compra cada grupo.',
    comps:[['Fondos disponibles','Flujo de fondos',7.4,38],['Planes vendidos','Series de tiempo',6.2,22],['Caída','Probabilidad y supervivencia',4.8,15],['% de compra por grupo','Parámetro del especialista',null,25]]}
};
const MORAK=['Mora BCRA','Caída','Mora cuota 1 y 2'];
const mOver=k=>MD[k].bt.model.map((v,i)=>v>MD[k].bt.thr?i:-1).filter(i=>i>=0);
const btAlerts=()=>Object.keys(MD).filter(k=>mOver(k).length);

/* mora */
function moraSeries(sc){
  const r=rng(31),s=SC[sc],n=36,out={bcra:[],resc:[],c1:[],c2:[]};
  let b=5.0,rc=1.35,c1=3.1,c2=2.4;
  for(let i=0;i<n;i++){
    if(i<HN){b+=(r()-.45)*.12;rc+=(r()-.5)*.05;c1+=(r()-.5)*.08;c2+=(r()-.5)*.07}
    else{const t=(i-HN+1)/12;b=b*(1+.004*(s.mora-.9)*4)+(r()-.5)*.05;rc=rc*(1+.003*(s.mora-.9)*4)+(r()-.5)*.02;c1=c1+(s.mora-1)*.02+(r()-.5)*.03;c2=c2+(s.mora-1)*.015+(r()-.5)*.03}
    out.bcra.push(b);out.resc.push(rc);out.c1.push(c1);out.c2.push(c2)}
  return out;
}

/* ---------- ancho de gráficos ---------- */
let CWF=340,CWH=340;
function sizes(){const vw=Math.min(window.innerWidth,1080);CWF=Math.max(260,vw-52);CWH=window.innerWidth<760?CWF:Math.floor((vw-24-14)/2-28)}

/* ---------- gráficos SVG ---------- */
function line({series,labels,w,h=230,fmt=fmtN,ymin,ymax,split,ticks=4,label='gráfico de líneas',hl}){
  w=w||CWH;const pl=48,pr=10,pt=12,pb=24;
  const vals=series.flatMap(s=>s.data).filter(v=>v!=null);
  let lo=ymin!=null?ymin:Math.min(...vals),hi=ymax!=null?ymax:Math.max(...vals);
  if(ymin==null){const sp=hi-lo||1;lo-=sp*.1;hi+=sp*.1}
  const n=labels.length,X=i=>pl+i*(w-pl-pr)/(n-1),Y=v=>pt+(1-(v-lo)/(hi-lo))*(h-pt-pb);
  let g='';
  for(let k=0;k<=ticks;k++){const v=lo+(hi-lo)*k/ticks,y=Y(v);
    g+=`<line x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}" class="grid"/><text x="${pl-6}" y="${y+4}" text-anchor="end" class="ax">${fmt(v)}</text>`}
  const ev=Math.ceil(n*46/(w-pl-pr));
  for(let i=0;i<n;i+=ev)g+=`<text x="${X(i)}" y="${h-6}" text-anchor="middle" class="ax">${labels[i]}</text>`;
  if(split!=null)g+=`<line x1="${X(split)}" x2="${X(split)}" y1="${pt}" y2="${h-pb}" class="split"/><text x="${X(split)+4}" y="${pt+9}" class="ax">proyección</text>`;
  if(hl!=null)g+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(hl.v)}" y2="${Y(hl.v)}" style="stroke:var(--red)" stroke-dasharray="4 3"/><text x="${w-pr}" y="${Y(hl.v)-4}" text-anchor="end" class="ax" style="fill:var(--red)">${hl.t}</text>`;
  for(const s of series){let d='',pen=false;
    s.data.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=true});
    g+=`<path d="${d}" fill="none" style="stroke:${s.color};opacity:${s.op||1}" stroke-width="${s.w||2}" ${s.dash?`stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round" stroke-linecap="round"/>`}
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${g}</svg>`;
}
function bars({labels,series,stacked=false,w,h=220,fmt=fmtN,ymax,fade,vals=false,ticks=4,label='gráfico de barras',rot=false}){
  w=w||CWH;const pl=48,pr=8,pt=14,pb=rot?40:24,n=labels.length;
  const tot=labels.map((_,i)=>stacked?series.reduce((a,s)=>a+s.data[i],0):Math.max(...series.map(s=>s.data[i])));
  const hi=ymax||Math.max(...tot)*1.1,Y=v=>pt+(1-v/hi)*(h-pt-pb);
  const slot=(w-pl-pr)/n,gap=Math.min(8,slot*.25),bw=stacked?slot-gap:(slot-gap)/series.length;
  let g='';
  for(let k=0;k<=ticks;k++){const v=hi*k/ticks,y=Y(v);
    g+=`<line x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}" class="grid"/><text x="${pl-6}" y="${y+4}" text-anchor="end" class="ax">${fmt(v)}</text>`}
  const ev=Math.ceil(n*(rot?20:40)/(w-pl-pr));
  const acc=labels.map(()=>0);
  series.forEach((s,si)=>s.data.forEach((v,i)=>{
    const x=pl+i*slot+gap/2+(stacked?0:si*bw),y0=Y(acc[i]+(stacked?v:v)),hgt=Math.max(0,Y(stacked?acc[i]:0)-y0);

const CAT={
  'Corolla Cross':['COROLLA CROSS XLI 2.0 CVT','COROLLA CROSS XEI 2.0 CVT','COROLLA CROSS SEG 2.0 CVT','COROLLA CROSS HEV 1.8 XEI ECVT','COROLLA CROSS HEV 1.8 SEG ECVT'],
  'Corolla':['COROLLA 2.0 SEG CVT','COROLLA 2.0 XEI CVT','COROLLA 2.0 XLI CVT','COROLLA GR-SPORT 2.0 CVT','COROLLA HEV 1.8 SEG ECVT','COROLLA HEV 1.8 XEI CVT'],
  'Hiace':['COMMUTER 2.8 TDI 6AT 14A ARS','FURGÓN L2H2 2.8 TDI 6AT 3A ARS','HIACE FURGÓN L1H1 2.8 TDI 6AT 3A','HIACE WAGON 2.8 TDI 6AT 10A'],
  'Hilux':['HILUX 4X2 CC DX 2.4 TDI 6 MT','HILUX 4X2 CS DX 2.4 TDI 6 MT','HILUX 4X2 CD SR 2.8 TDI 6 AT','HILUX 4X4 CD SRV 2.8 TDI 6 AT'],
  'Yaris':['YARIS XS 1.5 6 MT','YARIS XLS 1.5 6 MT','YARIS XLS 1.5 CVT']
};
const DM=[...Array(21)].map((_,i)=>({y:2025+Math.floor(i/12),l:MES[i%12]+'-'+String(25+Math.floor(i/12))}));
let DA=null;
function distData(){
  if(DA)return DA;DA={};
  const tot={'Corolla Cross':900,'Corolla':650,'Hiace':45,'Hilux':1500,'Yaris':500};
  Object.keys(CAT).forEach(m=>{
    const r=rng(hash(m)+17),vs=CAT[m],w=vs.map(()=>.5+r()*1.5),dr=vs.map(()=>(r()-.5)*.04);
    const wo=w.reduce((a,b)=>a+b,0)*.05;
    DA[m]=DM.map((_,t)=>{
      const T=tot[m]*(1+.15*Math.sin(t/3)+(r()-.5)*.2);
      const ww=[...vs.map((_,i)=>Math.max(.05,w[i]*(1+dr[i]*t)+(r()-.5)*.35*w[i])),wo*(1+(r()-.5)*.4)],s=ww.reduce((a,b)=>a+b,0);
      return ww.map(x=>Math.round(T*x/s));
    });
  });
  return DA;
}
/* proyección de unidades por versión a +3 y +6 meses: tendencia lineal de los últimos 6 meses sobre el mix,
   volumen del modelo = promedio de los últimos 3 meses ajustado por el escenario elegido */
function projRaw(m){
  const D=distData()[m],n=D[0].length,last=DM.length-1,k=6;
  const sh=D.map(u=>{const T=u.reduce((a,b)=>a+b,0);return u.map(x=>x/T)});
  const T3=[last-2,last-1,last].map(t=>D[t].reduce((a,b)=>a+b,0)).reduce((a,b)=>a+b,0)/3;
  const out={};
  [3,6].forEach(h=>{
    const s=[...Array(n)].map((_,i)=>{
      const ys=sh.slice(last-k+1).map(r=>r[i]),xm=(k-1)/2,ym=ys.reduce((a,b)=>a+b,0)/k;
      let num=0,den=0;ys.forEach((y,j)=>{num+=(j-xm)*(y-ym);den+=(j-xm)*(j-xm)});
      return Math.max(0,ym+(num/den)*((k-1+h)-xm))});
    const ss=s.reduce((a,b)=>a+b,0),Tp=T3*(1+(SC[S.sc].ven-1)*h/12);
    out[h]=s.map(x=>x/ss*Tp);
  });
  return out;
}
/* versiones excluidas: o se reescala el % del resto (el total del modelo se mantiene) o pasan a "Otros" */
function adjDist(m,u){
  const n=CAT[m].length,T=u.reduce((a,b)=>a+b,0),out=u.slice();
  const ex=[...Array(n)].map((_,i)=>i).filter(i=>S.dist.off.includes(m+'|'+i));
  if(!ex.length)return out;
  if(S.dist.modo==='otros'){ex.forEach(i=>{out[n]+=out[i];out[i]=0});return out}
  const rem=T-ex.reduce((a,i)=>a+u[i],0);
  if(rem<=0)return out.map(()=>0);
  return u.map((x,i)=>ex.includes(i)?0:x*T/rem);
}
function vDist(){
  const D=distData(),{modelo,anio,medida,modo,off}=S.dist,pct=medida==='pct';
  const hist=DM.map((_,i)=>i).filter(i=>anio==='Todos'||DM[i].y===+anio);
  const models=Object.keys(CAT).filter(m=>modelo==='Todos'||m===modelo);
  const PL=['dic-26 (+3 m)','mar-27 (+6 m)'],last=DM.length-1;
  const soft=p=>`color-mix(in srgb, var(--sc-base) ${Math.round(Math.min(1,p/.6)*45)}%, var(--surface))`;
  const cl=(ci)=>(ci>=hist.length?'pj':'')+(ci===hist.length?' p0':'');
  const vc=x=>x==null||!isFinite(x)?'<td>–</td>':`<td style="color:${x>=0?'var(--sc-opt)':'var(--red)'}">${x>=0?'+':'−'}${fmt1(Math.abs(x))}${pct?'':'%'}</td>`;
  const colsOf=m=>{const pr=projRaw(m);return [...hist.map(t=>adjDist(m,D[m][t])),adjDist(m,pr[3]),adjDist(m,pr[6])]};
  let body='';
  models.forEach(m=>{
    const n=CAT[m].length,names=[...CAT[m],'Otros'],cols=colsOf(m),tots=cols.map(u=>u.reduce((a,b)=>a+b,0));
    const a0=adjDist(m,D[m][last]),a3=adjDist(m,D[m][last-3]),a6=adjDist(m,D[m][last-6]);
    const T0=a0.reduce((a,b)=>a+b,0),T3=a3.reduce((a,b)=>a+b,0),T6=a6.reduce((a,b)=>a+b,0);
    const vr=(i,aB,TB)=>pct?(a0[i]/T0-aB[i]/TB)*100:(aB[i]>0?(a0[i]/aB[i]-1)*100:null);
    body+=`<tr class="mrow"><td>${m}</td>${tots.map((x,ci)=>`<td class="${cl(ci)}">${pct?'100%':fmtN(x)}</td>`).join('')}${pct?'<td>–</td><td>–</td>':vc((T0/T3-1)*100)+vc((T0/T6-1)*100)}</tr>`;
    names.forEach((v,i)=>{
      const exc=i<n&&off.includes(m+'|'+i);
      body+=`<tr class="${exc?'exc':''}"><td class="vn">${v}${exc?' <span class="tag">excluida</span>':''}</td>${cols.map((u,ci)=>{
        if(exc)return `<td class="${cl(ci)}">–</td>`;
        const p=tots[ci]?u[i]/tots[ci]:0;
        return pct?`<td class="${cl(ci)}" style="background:${soft(p)}">${Math.round(p*100)}%</td>`:`<td class="${cl(ci)}">${fmtN(u[i])}</td>`}).join('')}${exc?'<td>–</td><td>–</td>':vc(vr(i,a3,T3))+vc(vr(i,a6,T6))}</tr>`;
    });
  });
  const pal=['var(--sc-base)','var(--sc-opt)','var(--sc-pes)','var(--red)','#7A5BA6','#2A9DA8'];
  let chart='';
  if(modelo!=='Todos'){
    const m=modelo,n=CAT[m].length,names=[...CAT[m],'Otros'],cs=colsOf(m),tt=cs.map(u=>u.reduce((a,b)=>a+b,0));
    const colr=i=>i===n?'#9AA3AD':pal[i%pal.length];
    chart=`<div class="card"><h3>Evolución del mix de versiones: ${m}</h3>
      <p class="sub">Las dos últimas barras, más claras, son la proyección a +3 y +6 meses (escenario ${SC[S.sc].n.toLowerCase()}).</p>
      ${legend(names.map((v,i)=>[v,colr(i),1]))}
      ${bars({labels:[...hist.map(i=>DM[i].l),'+3 m','+6 m'],series:names.map((v,i)=>({data:cs.map((u,ci)=>tt[ci]?u[i]/tt[ci]*100:0),color:colr(i)})),stacked:true,w:CWF,h:250,ymax:100,fmt:x=>Math.round(x)+'%',rot:true,fade:i=>i>=hist.length,label:'Mix de versiones de '+m})}</div>`;
  }
  const keys=models.flatMap(m=>CAT[m].map((_,i)=>m+'|'+i));
  const incl=keys.filter(k=>!off.includes(k)).length;
  const vsel=`<div><label>Versiones</label><details class="ms" style="margin:0" ${S.dist.open?'open':''} ontoggle="S.dist.open=this.open"><summary>${incl} de ${keys.length} incluidas</summary><div class="msb"><div class="msa"><button onclick="distAll(true)">Todas</button><button onclick="distAll(false)">Ninguna</button></div>${models.map(m=>`<div class="sub" style="margin:6px 0 2px">${m}</div>`+CAT[m].map((v,i)=>`<label><input type="checkbox" ${off.includes(m+'|'+i)?'':'checked'} onchange="distTog('${m}',${i})"> ${v}</label>`).join('')).join('')}</div></details></div>`;
  return `
  <h2>Distribución de autos</h2>
  <div class="card">
    <p class="sub">Misma lectura que la tabla dinámica de Excel: cada modelo suma 100% por mes y las filas de abajo son sus versiones. Las dos columnas de proyección (+3 m y +6 m) y las variaciones de los últimos 3 y 6 meses son la base para anticipar pedidos. Deslizá hacia la derecha para ver todo.</p>
    <div class="ctl">
      ${sel('dm',['Todos',...Object.keys(CAT)],modelo,'distModelo','Modelo')}
      <div><label>Año</label><div class="seg">${['Todos','2025','2026'].map(a=>`<button aria-pressed="${a===anio}" onclick="distAnio('${a}')">${a}</button>`).join('')}</div></div>
      <div><label>Mostrar</label><div class="seg"><button aria-pressed="${pct}" onclick="distMed('pct')">Porcentaje</button><button aria-pressed="${!pct}" onclick="distMed('num')">Unidades</button></div></div>
    </div>
    <div class="ctl">
      ${vsel}
      <div><label>Lo que se destilda</label><div class="seg"><button aria-pressed="${modo==='rescale'}" onclick="distModo('rescale')">Reescalar el resto</button><button aria-pressed="${modo==='otros'}" onclick="distModo('otros')">Pasar a Otros</button></div></div>
    </div>
    <div class="tw"><table class="pv"><tr><th>Etiquetas de fila</th>${hist.map(i=>`<th>${DM[i].l}</th>`).join('')}${PL.map((l,j)=>`<th class="pj${j?'':' p0'}">${l}</th>`).join('')}<th>Var. 3 m${pct?' (pp)':''}</th><th>Var. 6 m${pct?' (pp)':''}</th></tr>${body}</table></div>
    <p class="sub" style="margin-top:8px">Si no van a pedir una versión, destildala: con “Reescalar el resto” su porcentaje se reparte proporcionalmente entre las demás y el total del modelo no cambia. “Otros” agrupa las versiones sin volumen propio.</p>
    <div class="note">El pedido sugerido se arma en Simulación y escenarios, tomando esta distribución como input <span class="tag">a definir</span>. Qué se cuenta en cada mes (retiros, adjudicaciones o ventas) sale de los datos de Toyota <span class="tag">a definir</span>.</div>
  </div>
  ${chart}`;
}

/* ---------- navegación y eventos ---------- */
const TABS=[['home','Resumen'],['vintage','Vintage'],['cambio','Cambio de modelo'],['dist','Distribución de autos'],['conv','Conversión'],['sim','Simulación y escenarios'],['grupos','Grupos'],['mora','Caída y mora'],['modelos','Modelos']];
const VIEWS={home:vHome,vintage:vVintage,cambio:vCambio,dist:vDist,conv:vConv,sim:vSim,grupos:vGrupos,mora:vMora,modelos:vModelos};
function render(keep){
  sizes();
  document.getElementById('nav').innerHTML=TABS.map(([k,n])=>`<button ${k===S.tab?'aria-current="page"':''} onclick="go('${k}')">${n}</button>`).join('');
  document.getElementById('scseg').innerHTML=Object.keys(SC).map(k=>`<button aria-pressed="${k===S.sc}" onclick="setSc('${k}')">${SC[k].n}</button>`).join('');
  const y=window.scrollY;
  document.getElementById('view').innerHTML=VIEWS[S.tab]();
  if(keep)window.scrollTo(0,y);
}
function go(t){S.tab=t;render();window.scrollTo(0,0);const a=document.querySelector('.nav [aria-current]');if(a)a.scrollIntoView({inline:'center',block:'nearest'})}
function setSc(k){S.sc=k;render(true)}
function fNivel(v){S.v.nivel=v;render(true)}function fPlan(v){S.v.plan=v;render(true)}
function fConc(v){S.v.conc=v;render(true)}function fUf(v){S.v.uf=v;render(true)}
function fModelo(v){S.v.modelo=v;render(true)}
function cmDim(d){S.cm.dim=d;S.cm.per=7;render(true)}
function cmPer(v){const l=S.cm.dim==='cosecha'?COSECHAS:['2025-T1','2025-T2','2025-T3','2025-T4','2026-T1','2026-T2','2026-T3','2026-T4*'];S.cm.per=l.indexOf(v);render(true)}
function moraC(v){S.mora.cuota=v;render(true)}
function shapSet(v){S.shap=v;render(true)}
function grSet(k,v){const n=Math.max(1,Math.min(12,parseInt(v)||1));S.gr[k]=n;document.getElementById('gres').innerHTML=renderGrupos()}
function cosTog(i){S.cos=S.cos.includes(i)?S.cos.filter(x=>x!==i):[...S.cos,i];render(true)}
function cosAll(f){S.cos=f?COSECHAS.map((_,i)=>i):[];render(true)}
function cuotasMode(m){S.cuotas=m;render(true)}
function convModelo(m){S.convModelo=m;render(true)}
function yyMes(v){S.yy.mes=v;render(true)}
function yyA(v){S.yy.a=parseInt(v);render(true)}
function yyB(v){S.yy.b=parseInt(v);render(true)}
function distModelo(v){S.dist.modelo=v;render(true)}
function distAnio(v){S.dist.anio=v;render(true)}
function distMed(v){S.dist.medida=v;render(true)}
function distTog(m,i){const k=m+'|'+i,o=S.dist.off;S.dist.off=o.includes(k)?o.filter(x=>x!==k):[...o,k];render(true)}
function distAll(f){S.dist.off=f?[]:Object.keys(CAT).flatMap(m=>CAT[m].map((_,i)=>m+'|'+i));render(true)}
function distModo(v){S.dist.modo=v;render(true)}
function verModelo(v){S.ver.modelo=v;S.ver.vc=VERS[v][0];render(true)}
function mvSel(k,m){S.mv=k;if(m)S.mm=m;render(true)}
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>render(true),150)});
render();
</script>
